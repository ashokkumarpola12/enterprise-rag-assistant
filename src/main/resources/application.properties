spring.application.name=enterprise-rag-assistant

server.port = 8082


# Temporarily disable OpenAI models
#spring.ai.model.chat=none
#spring.ai.model.embedding=openai
#spring.ai.openai.embedding.dimensions=1536
##spring.ai.model.image=none
##spring.ai.model.audio.speech=none
##spring.ai.model.audio.transcription=none
#
## OpenAI embedding configuration
#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.embedding.model=text-embedding-3-small
# Ollama local server
spring.ai.ollama.base-url=http://localhost:11434

# Use Ollama for embeddings
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.chat.temperature=0.2
#spring.ai.ollama.chat.options.model=llama3.2:3b
#spring.ai.ollama.chat.options.temperature=0.2

# RAG retrieval configuration
rag.retrieval.max-distance=0.40
rag.ingestion.directory = ${RAG_INGESTION_DIR}

# Temporarily disable PGvector
spring.ai.vectorstore.pgvector.enabled=false


# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5

# Markdown chunking configuration
rag.chunking.max-characters=1000
rag.chunking.overlap-characters=150

